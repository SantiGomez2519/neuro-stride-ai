[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gait-analysis-shared"
version = "0.1.0"
description = "Shared gait analysis package for neuro-stride-ai"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["gait_processing*"]
